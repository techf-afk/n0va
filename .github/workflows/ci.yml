name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
      - run: npm install
        working-directory: backend
      - name: Run backend tests
        run: node --test
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
      - run: npm install
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
